# DigitalOcean App Platform spec for 4830 Fit.
#
# Apply with:
#   doctl apps update <APP_ID> --spec .do/app.yaml
#
# Everything here is declarative: this file is the source of truth for the
# deployment, so a change is reviewed in a diff rather than clicked into a
# dashboard and forgotten.

# App Platform names must start with a letter, so the digits move to the end.
name: fit4830
region: nyc

databases:
  - name: db
    engine: PG
    version: "17"
    # dev databases are single-node and the cheapest tier App Platform will
    # attach. Move to a production cluster before this holds data you would
    # be upset to lose.
    cluster_name: fit4830-db
    production: false

services:
  - name: web
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    http_port: 3000

    github:
      repo: kngongo93/4830fit
      branch: main
      deploy_on_push: true

    build_command: npm run build
    run_command: npm start

    envs:
      # RUN_TIME only. ${db.DATABASE_URL} is a binding App Platform resolves
      # when the container starts; at build time it is still the literal
      # string, so exposing it to the build only invites something to try
      # connecting with it.
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}

    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
      period_seconds: 30
      failure_threshold: 3

jobs:
  # Runs before the new version takes traffic. A failed migration fails the
  # deploy and leaves the previous version serving, rather than crash-looping
  # a new container against a half-migrated database.
  - name: migrate
    kind: PRE_DEPLOY
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1

    github:
      repo: kngongo93/4830fit
      branch: main
      deploy_on_push: true

    # The job runs tsx against the TypeScript sources directly, so it needs
    # node_modules but not a Next build. The buildpack installs dependencies
    # before this command either way; skipping the compile keeps deploys from
    # paying for the same build twice.
    build_command: echo "no build needed for the migration job"
    # TEMPORARY diagnostic: report the database user permissions, then try the
    # migration. Always exits 0 so the deployment survives and its logs stay
    # readable. Restore to `npm run deploy:release` once diagnosed.
    run_command: npm run db:doctor && (npm run deploy:release || echo "RELEASE_FAILED")

    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
