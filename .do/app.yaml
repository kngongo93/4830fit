# DigitalOcean App Platform spec for 4830 Fit.
#
# Apply with:
#   doctl apps update <APP_ID> --spec .do/app.yaml
#
# Everything here is declarative: this file is the source of truth for the
# deployment, so a change is reviewed in a diff rather than clicked into a
# dashboard and forgotten.

# App Platform names must start with a letter, so the digits move to the end.
name: fit4830
region: nyc

databases:
  # A real managed cluster, not an App Platform dev database. The dev tier
  # hands the app a user with no CREATE on the database and none on public,
  # so an app that manages its own schema can never migrate: it cannot
  # create a single table. Verified twice on two freshly provisioned dev
  # databases before moving here.
  - name: db
    engine: PG
    cluster_name: fit4830-pg
    production: true
    db_name: fit4830
    db_user: fit_app

services:
  - name: web
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    http_port: 3000

    github:
      repo: kngongo93/4830fit
      branch: main
      deploy_on_push: true

    build_command: npm run build
    # Migrations run on start rather than in a PRE_DEPLOY job. The job
    # component failed twice with App Platform's opaque InternalError before
    # its container ever started - the same commit, the same image, nothing
    # of ours executed. A pre-deploy job is the better shape (it fails the
    # deploy while the old version keeps serving) so this is worth revisiting,
    # but a component the platform will not launch protects nothing.
    #
    # The safety mostly survives: migrate runs before next start, so a failed
    # migration exits non-zero, the container never serves, the deploy fails,
    # and App Platform rolls back to the previous version. Both steps are
    # idempotent, so a restart or a redeploy with nothing pending is a no-op.
    run_command: npm run deploy:release && npm start

    envs:
      # RUN_TIME only. ${db.DATABASE_URL} is a binding App Platform resolves
      # when the container starts; at build time it is still the literal
      # string, so exposing it to the build only invites something to try
      # connecting with it.
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}

    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
      period_seconds: 30
      failure_threshold: 3

